<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Chat</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      #messages {
        border: 1px solid #ccc;
        height: 400px;
        overflow-y: scroll;
        padding: 10px;
        margin: 20px 0;
      }
      .msg {
        margin: 5px 0;
      }
      .msg.me {
        background: #e6f7ff;
        padding: 6px 8px;
        border-radius: 6px;
        display: inline-block;
      }
      .system {
        color: gray;
        font-style: italic;
      }
      .typing-indicator {
        color: #888;
        font-style: italic;
      }

      #onlineUsers {
        background: #f0f2f5;
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 10px;
        font-size: 14px;
      }
      #onlineUsers .user-badge {
        display: inline-block;
        background: #25d366;
        color: white;
        border-radius: 12px;
        padding: 2px 10px;
        margin: 2px 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Chat Client</h2>
    <div>
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Username"
        title="Username"
        value="alice"
      />
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        title="Password"
        value="secret"
      />
      <button onclick="register()">Register</button>
      <button onclick="login()">Login</button>
    </div>
    <hr />
    <div>
      <label for="room">Room</label>
      <input
        type="text"
        id="room"
        name="room"
        placeholder="Room"
        title="Room"
        value="general"
      />
      <button onclick="connectWS()">Connect to Room</button>
      <button onclick="disconnectWS()">Disconnect</button>
    </div>

    <div id="onlineUsers">
      <strong>Online:</strong>
      <span id="userList">Nobody is here yet.</span>
    </div>

    <div>
      <input
        type="text"
        id="searchInput"
        placeholder="Search messages..."
        style="width: 70%"
      />
      <button onclick="searchMessages()">Search</button>
      <button onclick="clearSearch()">Clear</button>
      <span id="searchInfo"></span>
    </div>

    <div id="messages"></div>

    <div>
      <label for="msgInput">Message</label>
      <input
        type="text"
        id="msgInput"
        name="msgInput"
        placeholder="Type a message..."
        title="Message"
        disabled
      />
      <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
      <span id="typingStatus"></span>
      <hr />

      <div>
        <h3>Direct Messages</h3>
        <input type="text" id="dmUsername" placeholder="Search username..." />
        <button onclick="searchUser()">Search</button>
        <div id="searchResults"></div>
      </div>
    </div>

    <script>
      let ws = null;
      let currentRoom = null;
      let oldestMessageId = null;
      let oldestMessageTimestamp = null;
      let isLoadingMessages = false;
      let hasMoreMessages = true;
      let initialLoadDone = false;
      let token = null;
      let currentUser = null;
      // track seen message ids to avoid duplicates
      const seenMessageIds = new Set();
      let isSearchMode = false;
      let originalMessages = [];

      // search function
      async function searchMessages() {
        const query = document.getElementById("searchInput").value.trim();
        if (!query) {
          alert("Please enter a search term.");
          return;
        }

        const room = document.getElementById("room").value;
        if (!room) {
          alert("Please connect to a room first.");
          return;
        }

        try {
          const response = await fetch(
            `/api/v1/messages/search?q=${encodeURIComponent(query)}&room_id=${encodeURIComponent(room)}&limit=50`,
            { headers: { Authorization: `Bearer ${token}` } },
          );

          if (!response.ok) {
            alert("Search failed.");
            return;
          }

          const messages = await response.json();
          const messagesDiv = document.getElementById("messages");

          // Store original messages if not already stored
          if (!isSearchMode) {
            originalMessages = messagesDiv.innerHTML;
          }

          isSearchMode = true;
          messagesDiv.innerHTML = "";

          if (messages.length === 0) {
            messagesDiv.innerHTML =
              '<div class="system">No messages found matching your query.</div>';
          } else {
            messages.forEach((msg) => {
              const p = document.createElement("div");
              p.className = "msg";
              const time = new Date(msg.created_at).toLocaleTimeString();
              // Highlight the search term (simple version)
              const highlightedContent = msg.content.replace(
                new RegExp(query, "gi"),
                (match) => `<mark>${match}</mark>`,
              );
              p.innerHTML = `[${time}] <strong>${msg.username || "Unknown"}</strong>: ${highlightedContent}`;
              messagesDiv.appendChild(p);
            });
          }

          document.getElementById("searchInfo").textContent =
            `Showing ${messages.length} results for "${query}"`;
        } catch (error) {
          console.error("Search error:", error);
          alert("Search failed. Check console for details.");
        }
      }

      function clearSearch() {
        if (isSearchMode && originalMessages) {
          document.getElementById("messages").innerHTML = originalMessages;
          isSearchMode = false;
          originalMessages = null;
          document.getElementById("searchInfo").textContent = "";
          document.getElementById("searchInput").value = "";
        }
      }

      function logMessage(text, isSystem = true) {
        const div = document.getElementById("messages");
        const p = document.createElement("div");
        p.className = isSystem ? "system" : "msg";
        p.textContent = text;
        div.appendChild(p);
        div.scrollTop = div.scrollHeight;
      }

      // Registration

      async function register() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const res = await fetch("/api/v1/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username,
            email: `${username}@test.com`,
            password,
          }),
        });

        if (res.ok) logMessage(`Registration as ${username}`, true);
        else logMessage(`Registration failed: ${await res.text()}`, true);
      }

      //Login

      async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const formData = new URLSearchParams({ username, password });
        const res = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
        });
        if (res.ok) {
          const data = await res.json();
          token = data.access_token;
          currentUser = username;
          console.log("login token:", token);
          logMessage(`logged in as ${username}`, true);
          document.getElementById(`msgInput`).disabled = false;
          document.getElementById(`sendBtn`).disabled = false;
        } else {
          logMessage(` Login failed:${await res.text()}`, true);
        }
      }

      // search user

      async function searchUser() {
        const query = document.getElementById("dmUsername").value.trim();
        if (!query) return;

        const res = await fetch(
          `/api/v1/users/search?username=${encodeURIComponent(query)}`,
          {
            headers: { Authorization: `Bearer ${token}` },
          },
        );
        if (!res.ok) {
          alert("Search failed");
          return;
        }
        const users = await res.json();
        const resultsDiv = document.getElementById("searchResults");
        resultsDiv.innerHTML = "";

        if (users.length === 0) {
          resultsDiv.innerHTML = "<p>No users found.</p>";
          return;
        }

        users.forEach((user) => {
          const btn = document.createElement("button");
          btn.textContent = `Chat with ${user.username}`;
          btn.onclick = () => startDM(user.id);
          resultsDiv.appendChild(btn);
          resultsDiv.appendChild(document.createElement("br"));
        });
      }

      async function startDM(targetUserId) {
        const res = await fetch(`/api/v1/users/${targetUserId}/dm_room`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) {
          alert("Failed to get DM room");
          return;
        }
        const data = await res.json();
        document.getElementById("room").value = data.room_id; // Set the room input
        connectWS(); // Reuse the existing connection function!
      }

      // Establish connection with WebSocket.

      function connectWS() {
        if (!token) {
          alert("Please login first");
          return;
        }
        const room = document.getElementById("room").value;

        const wsUrl = `ws://${window.location.host}/ws/${room}?token=${token}`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          logMessage(`🔗 Connected to room: ${room}`, true);
          currentRoom = room;
          oldestMessageId = null;
          oldestMessageTimestamp = null;
          hasMoreMessages = true;
          isLoadingMessages = false;
          LoadMessages(room);
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          // Check if it's a typing event or a message event
          if (data.type === "typing") {
            document.getElementById("typingStatus").textContent =
              `${data.username} is typing...`;
            clearTimeout(window.typingTimeout);
            window.typingTimeout = setTimeout(() => {
              document.getElementById("typingStatus").textContent = "";
            }, 2000);
          } else if (data.type === "presence") {
            logMessage(`👤 ${data.username} ${data.status}`, true);
          } else if (data.type === "online_list") {
            const userListSpan = document.getElementById('userList');
            const users = Array.from(new Set(data.users || []));
            if (!users || users.length === 0) {
              userListSpan.innerHTML = 'Nobody is here yet.';
            } else {
              userListSpan.innerHTML = users.map(u =>
                `<span class="user-badge">${u}</span>`
              ).join(' ');
            }
          } else if (data.type === "message") {
            const messagesDiv = document.getElementById("messages");

            // Remove the "No messages yet" placeholder if it exists
            // Avoid duplicate messages by id
            if (data.id && seenMessageIds.has(data.id)) return;
            if (data.id) seenMessageIds.add(data.id);


            const placeholder = messagesDiv.querySelector(".system");
            if (
              placeholder &&
              placeholder.textContent.includes("No messages yet")
            ) {
              messagesDiv.innerHTML = "";
            }

            const p = document.createElement("div");
            p.className = "msg";
            if (data.username && currentUser && data.username === currentUser) {
              p.classList.add("me");
            }
            const time = data.created_at ? new Date(data.created_at).toLocaleTimeString() : new Date().toLocaleTimeString();
            p.textContent = `[${time}] ${data.username || "Unknown"}: ${data.content}`;
            messagesDiv.appendChild(p);

            // Auto-scroll down ONLY if the user is already at the bottom (i.e., they are following the conversation)
            const isAtBottom =
              messagesDiv.scrollHeight -
                messagesDiv.scrollTop -
                messagesDiv.clientHeight <
              10;

            if (isAtBottom) {
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
          }
        };

        ws.onclose = () => {
          logMessage("🔌 Disconnected", true);
          document.getElementById("typingStatus").textContent = "";
          console.log("WebSocket closed", ws);
        };

        ws.onerror = (err) => {
          logMessage(`⚠️ WebSocket Error: ${err}`, true);
          console.error("WebSocket error", err);
        };
      }

      function disconnectWS() {
        if (ws) ws.close();
      }

      function sendMessage() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          alert("Not connected");
          return;
        }
        const input = document.getElementById("msgInput");
        const content = input.value.trim();
        if (!content) return;
        ws.send(JSON.stringify({ type: "message", content }));
        input.value = "";
      }

      // Add typing detection
      document
        .getElementById("msgInput")
        .addEventListener("input", function () {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "typing", is_typing: true }));
            clearTimeout(window.typingSendTimeout);
            window.typingSendTimeout = setTimeout(() => {
              ws.send(JSON.stringify({ type: "typing", is_typing: false }));
            }, 1500);
          }
        });
      async function LoadMessages(
        roomId,
        beforeId = null,
        beforeTimestamp = null,
      ) {
        if (isLoadingMessages) return;
        if (!hasMoreMessages && beforeId !== null) return;

        isLoadingMessages = true;

        let url = `/api/v1/messages/${roomId}?limit=20`;
        if (beforeId && beforeTimestamp) {
          url += `&before_id=${beforeId}&before_timestamp=${encodeURIComponent(beforeTimestamp)}`;
        }

        try {
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!response.ok) {
            console.error("Failed to load messages:", response.status);
            return;
          }

          const messages = await response.json();

          if (messages.length < 20 && beforeId != null) {
            hasMoreMessages = false;
          }

          if (messages.length === 0) {
            if (beforeId === null) {
              document.getElementById("messages").innerHTML =
                '<div class="system">No messages yet. Say hello!</div>';
            }
            hasMoreMessages = false;
            return;
          }

          const messagesDiv = document.getElementById("messages");

          if (beforeId === null) {
            messagesDiv.innerHTML = "";
            messages.forEach((msg) => {
              // mark as seen
              if (msg.id) seenMessageIds.add(msg.id);
              const p = document.createElement("div");
              p.className = "msg";
              const time = new Date(msg.created_at).toLocaleTimeString();
              p.textContent = `[${time}] ${msg.username || "Unknown"}: ${msg.content}`;
              messagesDiv.appendChild(p);
            });

            if (messages.length > 0) {
              const oldest = messages[0];
              oldestMessageId = oldest.id;
              oldestMessageTimestamp = oldest.created_at;
            }

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          } else {
            const oldScrollHeight = messagesDiv.scrollHeight;

            const fragment = document.createDocumentFragment();
            messages.forEach((msg) => {
              if (msg.id && seenMessageIds.has(msg.id)) return;
              if (msg.id) seenMessageIds.add(msg.id);
              const p = document.createElement("div");
              p.className = "msg";
              const time = new Date(msg.created_at).toLocaleTimeString();
              p.textContent = `[${time}] ${msg.username || "Unknown"}: ${msg.content}`;
              fragment.appendChild(p);
            });

            // Prepend the fragment to the messages container
            messagesDiv.prepend(fragment);

            // Update the cursor to the new oldest message
            if (messages.length > 0) {
              const oldest = messages[0];
              oldestMessageId = oldest.id;
              oldestMessageTimestamp = oldest.created_at;
            }

            // CRITICAL: Adjust scroll position to prevent jumping.
            // The new content added above increased the scroll height.
            // We scroll down by exactly the amount of new content added.
            const newScrollHeight = messagesDiv.scrollHeight;
            const addedHeight = newScrollHeight - oldScrollHeight;
            messagesDiv.scrollTop = addedHeight;
          }
        } catch (error) {
          console.error("Error loading messages:", error);
        } finally {
          isLoadingMessages = false;
        }
      }
      // Scroll listener for infinite scrolling
      document
        .getElementById("messages")
        .addEventListener("scroll", function () {
          // If scrolled to the top, we have more messages, and we aren't already loading...
          if (
            this.scrollTop === 0 &&
            hasMoreMessages &&
            !isLoadingMessages &&
            currentRoom
          ) {
            // Load older messages
            LoadMessages(currentRoom, oldestMessageId, oldestMessageTimestamp);
          }
        });
    </script>
  </body>
</html>
